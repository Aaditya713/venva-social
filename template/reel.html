<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Locked 9:16 Reel frame around a rendered card (1080x1080). src/reel.mjs fills it via window.renderFrame. -->
<style>
  @font-face { font-family: Poppins; src: url(poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url(poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .frame { position: relative; width: 1080px; height: 1920px; font-family: Poppins, sans-serif; display: flex; flex-direction: column; }
  .frame.dark  { background: radial-gradient(120% 70% at 15% 10%, #2E7A5C 0%, #1F5C46 45%, #113A2B 100%); color: #fff; }
  .frame.light { background: linear-gradient(165deg, #F8F8F3 0%, #EEF4EF 60%, #E6EFE9 100%); color: #0F1A15; }
  /* Instagram covers roughly the top 200px (header) and bottom 400px (caption, buttons) of a Reel. */
  .top { height: 420px; display: flex; align-items: flex-end; justify-content: center; padding: 0 90px 44px; text-align: center; }
  .hook { font-weight: 700; font-size: 72px; line-height: 1.08; letter-spacing: -.5px; }
  .card { width: 1080px; height: 1080px; display: block; }
  .bottom { padding: 44px 90px 0; text-align: center; }
  .cta { font-weight: 600; font-size: 40px; line-height: 1.3; }
  .dark .cta  { color: #5CD69B; }
  .light .cta { color: #1F5C46; }
</style>
</head>
<body>
<div class="frame dark" id="frame">
  <div class="top"><div class="hook" id="hook"></div></div>
  <img class="card" id="card" alt="">
  <div class="bottom"><div class="cta" id="cta"></div></div>
</div>
<script>
window.renderFrame = ({ theme, hook, cta, card }) => {
  document.getElementById('frame').className = `frame ${theme}`;
  document.getElementById('hook').textContent = hook;
  document.getElementById('cta').textContent = cta;
  const img = document.getElementById('card');
  img.src = card;
  return Promise.all([img.decode(), document.fonts.ready]);
};
</script>
</body>
</html>
