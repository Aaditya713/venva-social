<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Locked 9:16 Reel around a rendered card (1080x1080). src/reel.mjs fills it via window.renderReel,
     then steps through the animation frame by frame (window.seek) and screenshots each frame. -->
<style>
  @font-face { font-family: Poppins; src: url(poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url(poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  .frame { position: relative; width: 1080px; height: 1920px; font-family: Poppins, sans-serif; overflow: hidden; }
  .frame.dark  { background: radial-gradient(120% 70% at 15% 10%, #2E7A5C 0%, #1F5C46 45%, #113A2B 100%); color: #fff; }
  .frame.light { background: linear-gradient(165deg, #F8F8F3 0%, #EEF4EF 60%, #E6EFE9 100%); color: #0F1A15; }
  /* Instagram covers roughly the top 200px (header) and bottom 400px (caption, buttons) of a Reel. */
  .hook { position: absolute; left: 90px; right: 90px; bottom: calc(1920px - 380px); text-align: center;
          font-weight: 700; font-size: 72px; line-height: 1.08; letter-spacing: -.5px; }
  .stage { position: absolute; top: 420px; left: 0; width: 1080px; height: 1080px; }
  .stage img { position: absolute; inset: 0; width: 1080px; height: 1080px; display: block; }
  .shadow { position: absolute; inset: 0; box-shadow: 0 30px 80px rgba(0,0,0,.28); }
  .light .shadow { box-shadow: 0 30px 80px rgba(15,26,21,.14); }
  .cta { position: absolute; top: 1540px; left: 90px; right: 90px; text-align: center; font-weight: 600; font-size: 40px; line-height: 1.3; }
  .dark .cta  { color: #5CD69B; }
  .light .cta { color: #1F5C46; }
  .track { position: absolute; top: 1524px; left: 90px; width: 900px; height: 6px; border-radius: 3px; overflow: hidden; }
  .dark .track  { background: rgba(255,255,255,.14); }
  .light .track { background: rgba(15,26,21,.10); }
  .bar { width: 100%; height: 100%; border-radius: 3px; transform-origin: left center; }
  .dark .bar  { background: #5CD69B; }
  .light .bar { background: #1F5C46; }
</style>
</head>
<body>
<div class="frame dark" id="frame">
  <div class="hook" id="hook1"></div>
  <div class="hook" id="hook2"></div>
  <div class="stage" id="stage">
    <div class="shadow"></div>
    <img id="tease" alt="">
    <img id="full" alt="">
  </div>
  <div class="track"><div class="bar" id="bar"></div></div>
  <div class="cta" id="cta"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const ease = 'cubic-bezier(.22,1,.36,1)';

// t: { reveal, wipe, total } in seconds. rect: the answer's area on the card {top, bottom} in px.
window.renderReel = async ({ theme, hooks, cta, tease, full, rect, t }) => {
  $('frame').className = `frame ${theme}`;
  $('hook1').textContent = hooks[0];
  $('hook2').textContent = hooks[1];
  $('cta').textContent = cta;
  $('tease').src = tease;
  $('full').src = full;
  await Promise.all([$('tease').decode(), $('full').decode(), document.fonts.ready]);

  const ms = s => s * 1000;
  const total = ms(t.total), at = (s, d = 0) => ({ delay: ms(s), duration: ms(d) || 1, fill: 'both', easing: ease });
  // Card: zoom in, then a slow drift for the rest of the Reel.
  $('stage').animate([{ transform: 'scale(.9)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], at(0, .7));
  $('stage').animate([{ translate: '0 0', scale: 1 }, { translate: '0 -10px', scale: 1.025 }], { ...at(.7, t.total - .7), easing: 'linear' });
  // Hook: slides up; swaps to the second line at the reveal.
  $('hook1').animate([{ transform: 'translateY(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], at(.15, .6));
  // Follow-up steps only fill forwards, so they don't override the first step before they start.
  $('hook1').animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(-30px)', opacity: 0 }], { ...at(t.reveal - .2, .35), fill: 'forwards' });
  $('hook2').animate([{ transform: 'translateY(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], at(t.reveal, .5));
  // Answer: wipes in from the top of its area to the bottom, like lines appearing.
  const top = rect.top, bottom = 1080 - rect.bottom;
  $('full').animate([{ clipPath: `inset(${top}px 0 ${1080 - top}px 0)` }, { clipPath: `inset(${top}px 0 ${bottom}px 0)` }],
    { ...at(t.reveal, t.wipe), easing: 'cubic-bezier(.45,0,.25,1)' });
  $('full').animate([{ clipPath: `inset(${top}px 0 ${bottom}px 0)` }, { clipPath: 'inset(0 0 0 0)' }], { ...at(t.reveal + t.wipe, .01), fill: 'forwards' });
  // Progress bar across the whole Reel; CTA fades in, then pulses near the end.
  $('bar').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { ...at(0, t.total), easing: 'linear' });
  $('cta').animate([{ opacity: 0 }, { opacity: 1 }], at(.8, .5));
  $('cta').animate([{ scale: 1 }, { scale: 1.08 }, { scale: 1 }], { ...at(t.total - 1.6, .7), fill: 'forwards' });
  window.seek(0);
};

// Pauses every animation at time s (seconds), so each screenshot is one exact frame.
window.seek = s => document.getAnimations().forEach(a => { a.pause(); a.currentTime = s * 1000; });
</script>
</body>
</html>
