<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Fonts are bundled locally so the headline font can never silently fall back. */
  @font-face { font-family: Anton; src: url(anton-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(poppins-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(poppins-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: Poppins; src: url(poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url(poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }

  :root {
    --green: #1F5C46;
    --green-mid: #2C6B50;
    --ink: #0F1A15;
    --mint: #5CD69B;
    --amber: #F2B33D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: Poppins, sans-serif; -webkit-font-smoothing: antialiased; }

  .card { position: relative; width: 1080px; height: 1080px; overflow: hidden;
          padding: 112px 88px 0; display: flex; flex-direction: column; }
  .card.dark  { background: radial-gradient(120% 120% at 15% 10%, #2E7A5C 0%, #1F5C46 45%, #113A2B 100%); color: #fff; }
  .card.light { background: linear-gradient(165deg, #F8F8F3 0%, #EEF4EF 60%, #E6EFE9 100%); color: var(--ink); }

  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-size: 54px 54px; }
  .dark::before  { background-image: radial-gradient(rgba(255,255,255,.06) 1.6px, transparent 1.8px); }
  .light::before { background-image: radial-gradient(rgba(15,26,21,.05) 1.6px, transparent 1.8px); }
  .orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .dark  .orb.a { width: 460px; height: 460px; top: -150px; right: -130px; background: rgba(255,255,255,.05); }
  .dark  .orb.b { width: 420px; height: 420px; bottom: -190px; left: -150px; background: rgba(255,255,255,.04); }
  .light .orb.a { width: 470px; height: 470px; top: -170px; right: -140px; background: rgba(31,92,70,.06); }

  .pill { align-self: flex-start; font-weight: 700; font-size: 29px; letter-spacing: .5px;
          text-transform: uppercase; padding: 9px 26px; border-radius: 999px; line-height: 1.2; }
  .dark .pill  { background: var(--amber); color: #1B1B1B; }
  .light .pill { background: var(--green-mid); color: #fff; }

  .headline { font-family: Anton, sans-serif; font-weight: 400; line-height: .98; letter-spacing: .3px; margin-top: 34px; }
  .dark .headline  { font-size: 104px; color: #fff; }
  .light .headline { font-size: 92px; color: var(--ink); }

  .spacer { flex: 1; }

  /* Myth / truth */
  .rule { width: 70px; height: 6px; border-radius: 3px; background: var(--mint); margin-bottom: 30px; }
  .kicker { font-weight: 700; font-size: 34px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mint); margin-bottom: 14px; }
  .dark .body { font-size: 33px; line-height: 1.6; color: #EEF5F1; }

  /* Stat */
  .stat { align-items: center; text-align: center; padding-top: 0; }
  .stat .ring { position: absolute; width: 600px; height: 600px; border-radius: 50%; left: 50%; top: 70px;
                transform: translateX(-50%); border: 2px solid rgba(255,255,255,.08); background: rgba(255,255,255,.025); }
  .stat .number { font-family: Anton, sans-serif; font-size: 280px; line-height: 1; margin-top: 150px; position: relative; }
  .stat .label { font-weight: 700; font-size: 40px; letter-spacing: 3px; text-transform: uppercase; color: var(--mint); margin-top: 26px; position: relative; }
  .stat .body { margin-top: 48px; font-size: 39px; line-height: 1.55; position: relative; }

  /* Tip (light) */
  .bar { align-self: flex-start; background: var(--green-mid); color: #fff; font-weight: 600; font-size: 44px;
         padding: 12px 30px; border-radius: 10px; margin-top: 48px; line-height: 1.3; }
  .light .body { font-size: 39px; line-height: 1.5; color: #2A302C; margin-top: 16px; max-width: 740px; }
  .light:has(.sections) .bar { margin-top: 30px; }
  .light:has(.sections) .headline { font-size: 88px; }
  .sections { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .sections .lbl { font-weight: 700; font-size: 30px; color: var(--ink); line-height: 1.3; }
  .sections .txt { font-size: 30px; line-height: 1.4; color: #2A302C; }

  /* Footer */
  .footer { position: relative; display: flex; align-items: center; justify-content: space-between;
            margin: 0 -10px; padding: 30px 0 64px; border-top: 2px solid; }
  .dark .footer  { border-color: rgba(255,255,255,.10); }
  .light .footer { border-color: rgba(15,26,21,.12); }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 46px; letter-spacing: -.5px; }
  .brand svg { width: 72px; height: 72px; }
  .light .brand { color: var(--green); }
  .handles { text-align: right; font-size: 27px; line-height: 1.35; }
  .handles .h { font-weight: 600; }
  .handles .u { font-weight: 700; }
  .dark .handles .h  { color: rgba(255,255,255,.78); }
  .dark .handles .u  { color: var(--mint); }
  .light .handles .h { color: #5E6763; }
  .light .handles .u { color: var(--green); }
  .stat .footer { width: 100%; text-align: initial; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines = s => esc(s).replace(/\n/g, '<br>');

const LOGO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
  <path d="M19.5 12.6 12 20l-7.5-7.4A4.8 4.8 0 0 1 12 6a4.8 4.8 0 0 1 7.5 6.6Z"/>
  <path d="M3.5 12h4l1.5-2.5 2.5 5 1.5-2.5h2"/></svg>`;

const footer = () => `<div class="footer">
  <div class="brand">${LOGO}<span>Venva</span></div>
  <div class="handles"><div class="h">@venva.health</div><div class="u">venva.co.in</div></div></div>`;

const templates = {
  myth: p => `<div class="card dark"><div class="orb a"></div><div class="orb b"></div>
    <div class="pill">${esc(p.label)}</div>
    <div class="headline">${lines(p.headline)}</div>
    <div class="spacer"></div>
    <div class="rule"></div>
    <div class="kicker">${esc(p.kicker || 'The truth')}</div>
    <div class="body">${lines(p.body)}</div>
    <div style="height:44px"></div>
    ${footer()}</div>`,

  stat: p => `<div class="card dark stat"><div class="orb a"></div><div class="orb b"></div><div class="ring"></div>
    <div class="number">${esc(p.number)}</div>
    <div class="label">${esc(p.label)}</div>
    <div class="body">${lines(p.body)}</div>
    <div class="spacer"></div>
    ${footer()}</div>`,

  tip: p => `<div class="card light"><div class="orb a"></div>
    <div class="pill">${esc(p.label)}</div>
    <div class="headline">${lines(p.headline)}</div>
    <div class="bar">${esc(p.highlight)}</div>
    ${p.sections?.length
      ? `<div class="sections">${p.sections.map(s => `<div><div class="lbl">${esc(s.title)}:</div><div class="txt">${lines(s.text)}</div></div>`).join('')}</div>`
      : `<div class="body">${lines(p.body)}</div>`}
    <div class="spacer"></div>
    ${footer()}</div>`,
};

window.renderPost = p => {
  document.getElementById('root').innerHTML = templates[p.template](p);
  return document.fonts.ready.then(() => {
    // Shrink the headline if a long one would overflow its area.
    const h = document.querySelector('.headline');
    if (h) { let size = parseFloat(getComputedStyle(h).fontSize);
      while (h.offsetHeight > size * .98 * 2.5 && size > 64) { size -= 4; h.style.fontSize = size + 'px'; } }
    // The spacer absorbs free space; if it collapses, the text is too long for the card.
    const spacer = document.querySelector('.spacer');
    return { overflow: spacer.offsetHeight < 8 };
  });
};
</script>
</body>
</html>
