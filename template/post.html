<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Fonts are bundled locally so the headline font can never silently fall back. */
  @font-face { font-family: Anton; src: url(anton-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(poppins-latin-400-normal.woff2) format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url(poppins-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: Poppins; src: url(poppins-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url(poppins-latin-700-normal.woff2) format('woff2'); font-weight: 700; }

  :root {
    --green: #1F5C46;
    --green-mid: #2C6B50;
    --ink: #0F1A15;
    --mint: #5CD69B;
    --amber: #F2B33D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: Poppins, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Geometry is measured from the original posts 1-10 (1080px canvas). */
  .card { position: relative; width: 1080px; height: 1080px; overflow: hidden;
          padding: 153px 81px 0; display: flex; flex-direction: column; }
  .card.dark  { background: radial-gradient(120% 120% at 15% 10%, #2E7A5C 0%, #1F5C46 45%, #113A2B 100%); color: #fff; }
  .card.light { background: linear-gradient(165deg, #F8F8F3 0%, #EEF4EF 60%, #E6EFE9 100%); color: var(--ink); }

  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-size: 54px 54px; }
  .dark::before  { background-image: radial-gradient(rgba(255,255,255,.06) 1.6px, transparent 1.8px); }
  .light::before { background-image: radial-gradient(rgba(15,26,21,.05) 1.6px, transparent 1.8px); }
  .orb { position: absolute; border-radius: 50%; pointer-events: none; }
  .dark  .orb.a { width: 460px; height: 460px; top: -150px; right: -130px; background: rgba(255,255,255,.05); }
  .dark  .orb.b { width: 420px; height: 420px; bottom: -190px; left: -150px; background: rgba(255,255,255,.04); }
  .light .orb.a { width: 470px; height: 470px; top: -170px; right: -140px; background: rgba(31,92,70,.06); }

  .pill { align-self: flex-start; font-weight: 700; font-size: 29px; letter-spacing: .5px; height: 54px;
          text-transform: uppercase; padding: 0 29px; border-radius: 999px; line-height: 54px; position: relative; }
  .dark .pill  { background: var(--amber); color: #1B1B1B; }
  .light .pill { background: var(--green-mid); color: #fff; }

  .headline { font-family: Anton, sans-serif; font-weight: 400; letter-spacing: .3px; position: relative; }
  .dark .headline  { font-size: 104px; line-height: .97; margin-top: 42px; color: #fff; }
  .light .headline { font-size: 91px; line-height: 1.04; margin-top: 52px; color: var(--ink); }

  .spacer { flex: 1; }

  /* Myth / truth: the truth block is anchored to the footer */
  .rule { width: 108px; height: 6px; border-radius: 3px; background: var(--mint); margin-bottom: 35px; position: relative; }
  .kicker { font-weight: 700; font-size: 34px; line-height: 48px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--mint); position: relative; }
  .dark .body { font-size: 42px; line-height: 59px; color: #EEF5F1; max-width: 840px; position: relative; }
  .truth-gap { height: 27px; flex: none; }

  /* Stat */
  .stat { align-items: center; text-align: center; padding-top: 0; }
  .stat .ring { position: absolute; width: 600px; height: 600px; border-radius: 50%; left: 50%; top: 68px;
                transform: translateX(-50%); border: 2px solid rgba(255,255,255,.08); background: rgba(255,255,255,.025); }
  .stat .number { font-family: Anton, sans-serif; font-size: 266px; line-height: 1; margin-top: 222px; position: relative; }
  .stat .label { font-weight: 700; font-size: 44px; line-height: 56px; letter-spacing: 3px; text-transform: uppercase; color: var(--mint); margin-top: 24px; position: relative; }
  .stat .body { margin-top: 90px; font-size: 40.5px; line-height: 55px; position: relative; max-width: none; }

  /* Tip (light) */
  .bar { align-self: flex-start; background: var(--green-mid); color: #fff; font-weight: 600; font-size: 41px;
         min-width: 552px; padding: 10px 64px 10px 30px; border-radius: 10px; margin-top: 96px; line-height: 57px; position: relative; }
  .light .body { font-size: 41px; line-height: 1.5; color: #2A302C; margin-top: 0; max-width: 780px; position: relative; }
  /* Tip with 3 sections (e.g. "How much protein?") starts higher and uses a smaller bar */
  .light:has(.sections) { padding-top: 121px; }
  .light:has(.sections) .headline { font-size: 85px; line-height: 1.06; margin-top: 40px; }
  .light:has(.sections) .bar { margin-top: 22px; font-size: 35px; line-height: 44px; padding: 10px 64px 10px 27px; }
  .sections { margin-top: 30px; display: flex; flex-direction: column; gap: 24px; position: relative; }
  .sections .lbl { font-weight: 700; font-size: 31px; line-height: 36px; color: var(--ink); }
  .sections .txt { font-size: 32.5px; line-height: 38px; color: #2A302C; }

  /* Footer: divider at y=927; the logo hangs 36px left of the text column, as in the originals */
  .footer { position: relative; display: flex; align-items: flex-start; justify-content: space-between;
            height: 153px; padding-top: 29px; border-top: 2px solid; flex: none; }
  .dark .footer  { border-color: rgba(255,255,255,.10); }
  .light .footer { border-color: rgba(15,26,21,.12); }
  .brand { display: flex; align-items: center; gap: 30px; margin-left: -36px; height: 60px;
           font-weight: 600; font-size: 43px; letter-spacing: -.5px; }
  .brand svg { width: 67px; height: 60px; flex: none; }
  .light .brand { color: var(--green); }
  .handles { text-align: right; font-size: 28.5px; line-height: 33px; margin-top: -7px; }
  .handles .h { font-weight: 600; }
  .handles .u { font-weight: 700; }
  .dark .handles .h  { color: rgba(255,255,255,.78); }
  .dark .handles .u  { color: var(--mint); }
  .light .handles .h { color: #5E6763; }
  .light .handles .u { color: var(--green); }
  .stat .footer { width: 100%; text-align: initial; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines = s => esc(s).replace(/\n/g, '<br>');

// Brand mark traced from venva.co.in/favicon-192.png — the real logo (also the Instagram avatar)
const LOGO = `<svg viewBox="42 48 108 96" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M96 66A26 26 0 1 0 55.6 98.4L96 138.8 136.4 98.4A26 26 0 1 0 96 66Z"/>
  <path d="M48 96H76L82 73 96 119 106 96H144"/></svg>`;

const footer = () => `<div class="footer">
  <div class="brand">${LOGO}<span>Venva</span></div>
  <div class="handles"><div class="h">@venva.health</div><div class="u">venva.co.in</div></div></div>`;

const templates = {
  myth: p => `<div class="card dark"><div class="orb a"></div><div class="orb b"></div>
    <div class="pill">${esc(p.label)}</div>
    <div class="headline">${lines(p.headline)}</div>
    <div class="spacer"></div>
    <div class="rule"></div>
    <div class="kicker">${esc(p.kicker || 'The truth')}</div>
    <div class="body">${lines(p.body)}</div>
    <div class="truth-gap"></div>
    ${footer()}</div>`,

  stat: p => `<div class="card dark stat"><div class="orb a"></div><div class="orb b"></div><div class="ring"></div>
    <div class="number">${esc(p.number)}</div>
    <div class="label">${esc(p.label)}</div>
    <div class="body">${lines(p.body)}</div>
    <div class="spacer"></div>
    ${footer()}</div>`,

  tip: p => `<div class="card light"><div class="orb a"></div>
    <div class="pill">${esc(p.label)}</div>
    <div class="headline">${lines(p.headline)}</div>
    <div class="bar">${esc(p.highlight)}</div>
    ${p.sections?.length
      ? `<div class="sections">${p.sections.map(s => `<div><div class="lbl">${esc(s.title)}:</div><div class="txt">${lines(s.text)}</div></div>`).join('')}</div>`
      : `<div class="body">${lines(p.body)}</div>`}
    <div class="spacer"></div>
    ${footer()}</div>`,
};

window.renderPost = p => {
  document.getElementById('root').innerHTML = templates[p.template](p);
  return document.fonts.ready.then(() => {
    // Shrink the headline if a long one would overflow its area.
    const h = document.querySelector('.headline');
    if (h) { let size = parseFloat(getComputedStyle(h).fontSize);
      while (h.offsetHeight > size * .98 * 2.5 && size > 64) { size -= 4; h.style.fontSize = size + 'px'; } }
    // The spacer absorbs free space; if it collapses, the text is too long for the card.
    // Originals never run body text past 4 lines; beyond that the layout gets cramped.
    const spacer = document.querySelector('.spacer');
    const body = document.querySelector('.body');
    const bodyLines = body ? Math.round(body.offsetHeight / parseFloat(getComputedStyle(body).lineHeight)) : 0;
    return { overflow: spacer.offsetHeight < 8 || bodyLines > 4, bodyLines };
  });
};
</script>
</body>
</html>
