name: Daily Instagram post

# Posts at 7:30 PM IST, just before India's 8–10 PM evening scroll peak.
# Every daily run prepares the post, then waits until POST_AT_IST to publish. It starts in two ways:
#  - cron-job.org (free) calls the GitHub API at 7:00 PM IST with daily=true. It's on time to the
#    minute, unlike GitHub's own scheduler, which can start runs hours late.
#  - GitHub's schedule below, as a backup at off-peak minutes.
# Daily runs queue one behind another, and each skips once today's post is out, so it never double-posts.
on:
  schedule:
    - cron: '7 11 * * *'    # 4:37 PM IST
    - cron: '7 12 * * *'    # 5:37 PM IST (backup)
    - cron: '7 13 * * *'    # 6:37 PM IST (backup)
  workflow_dispatch:          # "Run workflow" button posts right away; cron-job.org sends daily=true
    inputs:
      daily:
        description: 'Daily run: wait until posting time, skip if already posted today'
        type: boolean
        default: false

concurrency: daily-post
permissions:
  contents: write

env:
  POST_AT_IST: '19:30'       # Change this to move the posting time (also move the triggers before it).
  DAILY: ${{ github.event_name == 'schedule' || inputs.daily == true }}

jobs:
  post:
    runs-on: ubuntu-24.04   # pinned: Playwright deps are tested on 24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - name: Skip if today's post is already out
        id: check
        run: |
          # Was anything posted today, by the IST calendar date?
          posted=$(node -e '
            const ist = d => new Date(new Date(d).getTime() + 330 * 60000).toISOString().slice(0, 10);
            const q = require("./content/queue.json");
            console.log(q.some(p => p.postedAt && ist(p.postedAt) === ist(Date.now())) ? "yes" : "no");')
          if [ "$DAILY" = "true" ] && [ "$posted" = "yes" ]; then
            echo "Today's post is already published — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Top up queue and render next post
        if: steps.check.outputs.skip != 'true'
        run: node src/daily.mjs prepare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Push image so Instagram can fetch it
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "venva-bot"
          git config user.email "venva-bot@users.noreply.github.com"
          git add posts content/queue.json
          git commit -m "Prepare today's post" || echo "nothing to commit"
          git pull --rebase && git push

      - name: Wait until posting time
        id: wait
        if: steps.check.outputs.skip != 'true' && env.DAILY == 'true'
        run: |
          wait=$(( $(TZ=IST-5:30 date -d "today $POST_AT_IST" +%s) - $(date +%s) ))
          if [ "$wait" -gt 14400 ]; then
            echo "::notice::Started $((wait / 3600))h before $POST_AT_IST IST — too early for today's post, skipping"
            echo "too_early=true" >> "$GITHUB_OUTPUT"
          elif [ "$wait" -gt 0 ]; then
            echo "Waiting $((wait / 60)) min until $POST_AT_IST IST"
            sleep "$wait"
          else
            echo "::warning::Run started $(( -wait / 60 )) min after $POST_AT_IST IST — posting now"
          fi

      - name: Publish to Instagram
        if: steps.check.outputs.skip != 'true' && steps.wait.outputs.too_early != 'true'
        run: node src/daily.mjs publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/posts

      - name: Record published post
        if: steps.check.outputs.skip != 'true'
        run: |
          git add content/queue.json
          git commit -m "Mark post published" || echo "nothing to commit"
          git pull --rebase && git push
