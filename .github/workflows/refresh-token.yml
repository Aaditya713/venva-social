name: Refresh Instagram token

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday; tokens last 60 days
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: Playwright deps are tested on 24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm ci
      - name: Refresh and store new token
        run: |
          TOKEN=$(node src/daily.mjs refresh-token)
          echo "::add-mask::$TOKEN"
          gh secret set IG_ACCESS_TOKEN --body "$TOKEN" --repo "${{ github.repository }}"
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
